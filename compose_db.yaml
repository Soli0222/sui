services:
  test-db:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    ports:
      - "${SUI_TEST_PG_PORT:-5555}:5432"
    environment:
      POSTGRES_USER: sui_test
      POSTGRES_PASSWORD: sui_test
      POSTGRES_DB: sui_test
      TZ: Asia/Tokyo
    tmpfs:
      - /var/lib/postgresql
