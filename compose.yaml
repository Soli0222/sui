services:
  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: sui
      POSTGRES_PASSWORD: sui
      POSTGRES_DB: sui
      TZ: Asia/Tokyo
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sui"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      target: runtime
    image: sui-app:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://sui:sui@db:5432/sui
      TZ: Asia/Tokyo
      STATIC_DIR: /app/frontend-dist
      SUI_AUTH_MODE: ${SUI_AUTH_MODE:-enabled}
      SUI_OIDC_ISSUER: ${SUI_OIDC_ISSUER:-}
      SUI_OIDC_CLIENT_ID: ${SUI_OIDC_CLIENT_ID:-}
      SUI_OIDC_CLIENT_SECRET: ${SUI_OIDC_CLIENT_SECRET:-}
      SUI_OIDC_REDIRECT_URI: ${SUI_OIDC_REDIRECT_URI:-}
      SUI_OIDC_ALLOWED_SUBJECTS: ${SUI_OIDC_ALLOWED_SUBJECTS:-}
      SUI_OIDC_ALLOWED_EMAILS: ${SUI_OIDC_ALLOWED_EMAILS:-}
      SUI_COOKIE_SECURE: ${SUI_COOKIE_SECURE:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
