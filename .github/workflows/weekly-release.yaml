name: Weekly Release PR Merge

on:
  schedule:
    - cron: '0 22 * * 6' # Sunday 07:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          repositories: ${{ github.event.repository.name }}
          client-id: ${{ secrets.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
      - name: Merge only the checked release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: python3 scripts/release/weekly_merge.py
