name: Publish Docker image

# All entry points use this wrapper so version checks also apply to retries.
on:
  workflow_call:
    inputs:
      ref:
        description: Released commit SHA
        required: true
        type: string
      version:
        description: Release version without a v prefix
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.repository }}
  queue: max

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Check released package versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: make version-check VERSION="$RELEASE_VERSION"

  publish:
    needs: version-check
    uses: Soli0222/shared-workflows/.github/workflows/publish-image.yaml@119de6bc19fdd3e2d77f0decb8bd5bd976a7a645
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version }}
      platforms: linux/amd64,linux/arm64

  latest:
    name: Update latest stable image
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Advance latest only for the current stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            echo "Prereleases do not update latest."
            exit 0
          fi
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [[ "$latest" != "$RELEASE_VERSION" ]]; then
            echo "Release $RELEASE_VERSION is not the latest stable release; leaving latest unchanged."
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create -t "${image}:latest" "${image}:${RELEASE_VERSION}"
