name: Release Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pipeline-${{ github.repository }}
  queue: max

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          repositories: ${{ github.event.repository.name }}
          client-id: ${{ secrets.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  publish-image:
    name: Publish Application Image
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yaml
    with:
      ref: ${{ needs.release-please.outputs.sha }}
      version: ${{ needs.release-please.outputs.version }}

  # Reconcile the latest main chart after the released image is verified.
  publish-chart:
    name: Publish Helm Chart
    needs: [release-please, publish-image]
    permissions:
      contents: write
      packages: write
    uses: Soli0222/shared-workflows/.github/workflows/publish-chart.yaml@v1.1.0

  report-chart:
    name: Report chart result
    needs: publish-chart
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.publish-chart.outputs.result }}
          VERSION: ${{ needs.publish-chart.outputs.version }}
        run: echo "Chart result=$RESULT version=$VERSION" >> "$GITHUB_STEP_SUMMARY"
