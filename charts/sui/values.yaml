nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/soli0222/sui
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

replicaCount: 1

containerPort: 3000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: example.tld
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

config:
  timeZone: Asia/Tokyo
  staticDir: /app/frontend-dist
  # SUI_LOG_LEVEL. Empty keeps the application default (info)
  logLevel: ""
  # SUI_ALLOWED_ORIGINS. Origins allowed by CORS. Same-host requests are always allowed
  allowedOrigins: []
  # SUI_FRONTEND_URL. Redirect target after login. Not needed when the backend
  # serves the SPA, in which case it redirects to /
  frontendUrl: ""

# Foreign exchange rates used for the JPY conversion. Empty keeps the
# application default
exchangeRate:
  # SUI_EXCHANGE_RATE_API_BASE_URL. Base URL of the rate provider
  # (default https://api.frankfurter.dev/v2)
  apiBaseUrl: ""
  # SUI_EXCHANGE_RATE_REFRESH_INTERVAL_MS. Minimum interval between refetches
  # (default 300000). 0 refetches on every lookup
  refreshIntervalMs: ""
  # SUI_EXCHANGE_RATE_REQUEST_TIMEOUT_MS. Per-request timeout (default 5000)
  requestTimeoutMs: ""

# Authentication (sui >= 2.0.0). OIDC sessions for the UI, API tokens for API/MCP
auth:
  # SUI_AUTH_MODE: enabled or disabled
  mode: enabled
  oidc:
    issuer: ""
    clientId: ""
    # Read the client ID from an existing Secret instead of setting clientId
    # above. When existingSecret is set, it takes precedence over clientId
    clientIdSecret:
      existingSecret: ""
      existingSecretKey: clientId
    # Full externally reachable callback URL. The path is always
    # /api/auth/callback, and the value must match the redirect URI registered
    # with the IdP exactly, e.g. https://sui.example.tld/api/auth/callback
    redirectUri: ""
    # At least one of allowedSubjects / allowedEmails must be set, otherwise
    # OIDC is treated as unconfigured and nobody can log in
    allowedSubjects: []
    # Matched case-insensitively, and only when the ID token has
    # email_verified: true
    allowedEmails: []
    # Only needed for confidential clients. Public clients can leave this unset
    clientSecret:
      existingSecret: ""
      existingSecretKey: clientSecret
  # SUI_COOKIE_SECURE. Forces Secure cookies and the HTTPS decision that also
  # drives Strict-Transport-Security. Empty lets the app decide from
  # x-forwarded-proto
  cookieSecure: ""

# MCP endpoint limits (sui >= 2.0.0-beta.3). Empty keeps the application default
mcp:
  # SUI_MCP_MAX_SESSIONS. Concurrent MCP sessions across all tokens (default 1000)
  maxSessions: ""
  # SUI_MCP_MAX_SESSIONS_PER_TOKEN. Concurrent sessions per token (default 10)
  maxSessionsPerToken: ""
  # SUI_MCP_MAX_REQUESTS_PER_MINUTE. Requests per minute per token (default 120)
  maxRequestsPerMinute: ""
  # SUI_MCP_MAX_CONCURRENT_REQUESTS. In-flight requests per token (default 10)
  maxConcurrentRequests: ""

# Audit log (sui >= 2.0.0-beta.3). Cleanup runs once at startup, then every 24h
audit:
  # SUI_AUDIT_LOG_RETENTION_DAYS. Days to keep audit log rows. 0 disables the
  # automatic deletion and keeps rows forever. Empty keeps the default (365)
  retentionDays: ""

# OpenTelemetry traces. Disabled while both endpoints are empty
tracing:
  endpoint: ""
  tracesEndpoint: ""
  serviceName: sui-backend

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "18.6-bookworm"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    size: 1Gi
    accessModes:
      - ReadWriteOnce
  auth:
    database: sui
    user: sui
    existingSecret: ""
    existingSecretKey: POSTGRES_PASSWORD
  resources: {}

externalPostgres:
  host: ""
  port: 5432
  database: ""
  user: ""
  existingSecret: ""
  existingSecretKey: password

extraEnv: []
